services:
  - type: worker
    name: button-game-clicker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GAME_ID
        sync: false
      - key: SESSION_COOKIE
        sync: false
      - key: TARGET_HOURS
        value: "23"
      - key: POLL_SECONDS
        value: "60"
      - key: PRESS_BUFFER_SECONDS
        value: "5"
